name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  ci:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Default Xcode on macos-15 is 16.4, which does not support #bundle (Xcode 26+).
      - name: Select Xcode 26
        run: |
          set -euo pipefail
          for candidate in \
            /Applications/Xcode_26.3.app \
            /Applications/Xcode_26.2.app \
            /Applications/Xcode_26.1.1.app \
            /Applications/Xcode_26.0.1.app
          do
            if [ -d "${candidate}" ]; then
              sudo xcode-select -s "${candidate}"
              break
            fi
          done
          xcodebuild -version
          swift --version

      - name: Run KlikMenuCore package tests
        working-directory: KlikMenu/Packages/KlikMenuCore
        run: swift test

      - name: Run KlikMenuCore Xcode tests
        working-directory: KlikMenu
        run: |
          set -euo pipefail

          DESTINATION="$(
            xcodebuild -project KlikMenu.xcodeproj -scheme KlikMenuCore -showdestinations 2>/dev/null \
              | awk -F'[,}]' '
                  /platform:iOS Simulator/ && /name:iPhone/ {
                    for (i = 1; i <= NF; i++) {
                      if ($i ~ /^ id:/) {
                        gsub(/^ id:/, "", $i)
                        print "id=" $i
                        exit
                      }
                    }
                  }
                '
          )"

          if [ -z "${DESTINATION}" ]; then
            echo "No iPhone simulator destination found"
            xcodebuild -project KlikMenu.xcodeproj -scheme KlikMenuCore -showdestinations
            exit 1
          fi

          echo "Using destination: ${DESTINATION}"
          xcodebuild test \
            -project KlikMenu.xcodeproj \
            -scheme KlikMenuCore \
            -destination "${DESTINATION}"
