name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  ci:
    # macos-15 tops out at Xcode 26.3 / iOS 26.2; project targets iOS 26.4.
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Select Xcode matching project deployment target
        run: |
          set -euo pipefail
          for candidate in \
            /Applications/Xcode_26.4.1.app \
            /Applications/Xcode_26.4.app \
            /Applications/Xcode_26.5.app \
            /Applications/Xcode_26.6.app \
            /Applications/Xcode.app
          do
            if [ -d "${candidate}" ]; then
              sudo xcode-select -s "${candidate}"
              break
            fi
          done
          sudo xcodebuild -runFirstLaunch
          xcodebuild -version
          swift --version

      - name: Run KlikMenuCore package tests
        working-directory: KlikMenu/Packages/KlikMenuCore
        run: swift test

      - name: Run KlikMenuCore Xcode tests
        working-directory: KlikMenu
        run: |
          set -euo pipefail

          # App scheme exposes real simulator destinations; framework-only schemes often do not on CI.
          xcodebuild test \
            -project KlikMenu.xcodeproj \
            -scheme KlikMenu \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -only-testing:KlikMenuCoreTests
