name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  ci:
    # project.xcproj (JSON) needs Xcode 27+; macos-26 only ships Xcode 26.x.
    runs-on: xcode-27
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Select Xcode matching local toolchain
        run: |
          set -euo pipefail
          for candidate in \
            /Applications/Xcode_27.2.app \
            /Applications/Xcode_27.2.0.app \
            /Applications/Xcode_27.2_Release_Candidate.app \
            /Applications/Xcode_27.1.app \
            /Applications/Xcode_27.app \
            /Applications/Xcode.app
          do
            if [ -d "${candidate}" ]; then
              sudo xcode-select -s "${candidate}"
              break
            fi
          done
          sudo xcodebuild -runFirstLaunch
          xcodebuild -version
          swift --version

      - name: Run KlikMenuCore package tests
        working-directory: KlikMenu/Packages/KlikMenuCore
        run: swift test

      - name: Run KlikMenuCore Xcode tests
        working-directory: KlikMenu
        run: |
          set -euo pipefail

          # App scheme exposes real simulator destinations; framework-only schemes often do not on CI.
          # Pin OS=27.0: xcode-27 image lists iPhone 18 Pro under iOS 27.0 (not under 27.2).
          xcodebuild test \
            -project KlikMenu.xcodeproj \
            -scheme KlikMenu \
            -destination 'platform=iOS Simulator,name=iPhone 18 Pro,OS=27.0' \
            -only-testing:KlikMenuCoreTests
